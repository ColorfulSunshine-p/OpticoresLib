# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms and Java versions, and provides a first line of defence
# against bad commits.
#
# The build matrix is intentionally explicit: every Minecraft patch, loader
# version, mapping set and Java toolchain is pinned in gradle.properties, so a
# new target means a new matrix entry, not a silent upgrade.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['21']
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: ${{ matrix.java }}
      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
