plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = "${mod_version}"
group = "${maven_group}"

base {
    archivesName = "${archives_base_name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// The `testing` module of the architecture plan lives in its own source set so that
// test doubles (fake clock, deterministic executor) are never shipped inside the
// published mod artifact and can never become runtime production hooks.
sourceSets {
    testFixtures {
        java.srcDirs = ['src/testFixtures/java']
        resources.srcDirs = ['src/testFixtures/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // OptiCores is a "provided" (compile only) mod dependency.
    //
    // It is on the compile classpath so that the integration surface can be developed and
    // type checked against the real consumer, but it is NOT bundled into the published
    // artifact and it is NOT a runtime requirement. The library must keep working when
    // OptiCores is absent, which is why nothing in the version neutral core may reference
    // an OptiCores class (enforced by PackageBoundaryTest).
    modCompileOnly files("libs/Opticores-1.1.1+1.21.1.jar")

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_platform_version}"
    testImplementation sourceSets.testFixtures.output
}

processResources {
    def versionValue = version
    inputs.property "version", versionValue
    filesMatching("fabric.mod.json") {
        expand "version": versionValue
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
